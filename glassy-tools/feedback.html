<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - EdityourPDF</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Outfit:wght@300;400;600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-mesh">
        <div class="mesh-1"></div>
        <div class="mesh-2"></div>
        <div class="mesh-3"></div>
    </div>

    <div class="app-container"
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <main class="glass-content" style="max-width: 600px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="fa-solid fa-comment-dots" style="font-size: 4rem; color: #a78bfa; margin-bottom: 20px;"></i>
                <h1
                    style="font-size: 2.5rem; background: linear-gradient(135deg, #a78bfa, #00e5ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">
                    We Value Your Feedback</h1>
                <p style="color: #a5b4fc; font-size: 1rem; margin-top: 10px;">Have a suggestion, feature request, or
                    found a bug? Let us know!</p>
            </div>

            <form id="feedback-form" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px;"
                onsubmit="event.preventDefault(); alert('Thank you for your feedback!'); window.location.href='index.html';">
                <div>
                    <label style="color: #fff; font-size: 0.9rem; margin-bottom: 5px; display: block;">Your Email
                        (optional)</label>
                    <input type="email" class="glass-input" style="width: 100%; box-sizing: border-box;"
                        placeholder="john@example.com">
                </div>
                <div>
                    <label style="color: #fff; font-size: 0.9rem; margin-bottom: 5px; display: block;">Message <span
                            style="color:#ff0076">*</span></label>
                    <textarea class="glass-input"
                        style="width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical;"
                        placeholder="Tell us what you think..." required></textarea>
                </div>
                <button type="submit" class="glass-btn primary" style="width: 100%; justify-content: center;">
                    <i class="fa-solid fa-paper-plane"></i> Send Feedback
                </button>
            </form>

            <div style="text-align: center;">
                <a href="index.html" class="glass-btn secondary"
                    style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </main>
    </div>
</body>

</html>
